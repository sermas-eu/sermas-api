name: CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -q && sudo apt-get install -y -q sox
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Audit (report only)
        if: always()
        run: npm audit --omit=dev || true
