# The API as a container, on :3000. Started by sermas-dev's `task docker:start`, which
# also runs the infrastructure it needs. Every reference in its configuration goes
# through the docker host (172.17.0.1), so nothing here depends on a shared network.

services:
  api:
    build: .
    image: sermas-api:local
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file:
      - path: ${SERMAS_DEV_ROOT:-.}/config/api/.env
        required: false
    environment:
      ENV_PATH: /config/.env
      CONFIG_BASEPATH: /config
    volumes:
      - ${SERMAS_DEV_ROOT:-.}/config/api:/config:ro
    command: ["dist/apps/api/main.js"]
